name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formula:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: Homebrew/actions/setup-homebrew@c262868c096d909fc278daa87ed9772967331ea3 # main
      - name: Check style
        run: brew style ibiscite/tap
      - name: Install and test
        run: |
          brew install --formula ibiscite/tap/ibis
          brew test ibiscite/tap/ibis
          brew audit --formula ibiscite/tap/ibis
